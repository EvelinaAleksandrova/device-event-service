services:
  app:
    build: .
    env_file:
      # Optional so `docker compose up postgres` still works in CI, where there is no .env.
      - path: .env
        required: false
    environment:
      # Overrides .env: inside Docker the database is reached by service name, not localhost:5433.
      DATABASE_URL: postgres://ingest:ingest@postgres:5432/device_events
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest
      POSTGRES_DB: device_events
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ingest -d device_events"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
